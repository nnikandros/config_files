set -g default-terminal "screen-256color" 
set-window-option -g mode-keys vi     
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sidebar'

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
set-option -g renumber-windows on

# ---------------------------------------------------------------------------
# Status bar styling: make it visible and highlight the focused window
# ---------------------------------------------------------------------------

# Refresh status more often and enable 256-color / UTF-8 support
set -g status-interval 5
set -g status-justify left

# Overall status bar colors (background + default text)
set -g status-style "bg=colour236,fg=colour250"

# Left side: session name, bold on a blue block
set -g status-left-length 30
set -g status-left "#[bg=colour39,fg=colour232,bold] #S #[bg=colour236,fg=colour39]"

# Right side: date and time
set -g status-right-length 60
set -g status-right "#[fg=colour39]#[bg=colour39,fg=colour232,bold] %Y-%m-%d  %H:%M "

# Inactive windows: dim, low-contrast
set -g window-status-style "bg=colour236,fg=colour244"
set -g window-status-format " #I:#W#F "

# Active (focused) window: bright, bold, with arrow separators so it stands out
set -g window-status-current-style "bg=colour214,fg=colour232,bold"
set -g window-status-current-format "#[fg=colour236,bg=colour214]#[fg=colour232,bg=colour214,bold] #I:#W#F #[fg=colour214,bg=colour236]"

# Highlight windows with activity/bell
set -g window-status-activity-style "bg=colour236,fg=colour203,bold"

# Make the active pane border obvious too
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour214"

# Brief message display colors
set -g message-style "bg=colour214,fg=colour232,bold"

run '~/.config/tmux/plugins/tpm/tpm'
